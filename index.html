<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT10 SW2 </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css"/>
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
</head>
<body>

<div class="container my-5">
<div class="bg-light bg-opacity-75 p-4 rounded-3 mx-auto" style="max-width: 700px;">

  <h1 class="text-center text-dark mb-4">The Nickname Atlas of Southeast Asia</h1>

    <div class="border rounded-2 p-2 mb-2 d-flex align-items-center justify-content-between">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="item1" value="99">
            <label class="form-check-label fs-6" for="item1">Americano</label>
      </div>
      <span class="fw-bold text-info fs-6">₱99</span>
    </div>


  <button type="submit" class="btn btn-info w-75 d-block mx-auto" py-click="create_order">Reveal Nickname</button>
  <hr class="my-4">

  <h3 id="X" class="mt-3 fs-6 fw-light text-center">Your order summary will appear here.</h3>
    <div id="show-subtotal"></div>
    <div id="show-tax"></div>
    <div id="show-total" class="fw-bold"></div>

</div>
</div>

    <script type="py" src="main.py"></script>
    
</body>
</html>
